<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wolf Expansion Settings</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header>
        <div class="brand-lockup">
          <img src="icons/wolf-expansion-mark-48.png" alt="" width="48" height="48" />
          <div>
            <p class="eyebrow">ChatGPT</p>
            <h1>The Wolf Expansion</h1>
          </div>
        </div>
        <p class="intro">Settings are stored locally in Firefox and apply to open ChatGPT tabs.</p>
      </header>

      <form id="settings-form">
        <fieldset>
          <legend>General</legend>
          <label class="setting-row">
            <span>
              <strong>Enable Wolf Expansion</strong>
              <small>Turns all extension features on or off.</small>
            </span>
            <input id="enabled" type="checkbox" />
          </label>
          <label class="setting-row">
            <span>
              <strong>Debug logging</strong>
              <small>Writes local diagnostic events to the ChatGPT tab console.</small>
            </span>
            <input id="debug-enabled" type="checkbox" />
          </label>
        </fieldset>

        <fieldset>
          <legend>Quick Access</legend>
          <label class="setting-row">
            <span>
              <strong>Enable Quick Access</strong>
              <small>Show Wolf Expansion's chat organization system.</small>
            </span>
            <input id="favorites-enabled" type="checkbox" />
          </label>
          <label class="setting-row">
            <span>
              <strong>Show Quick Access star icons</strong>
              <small>Displays add/remove stars on ChatGPT conversation rows.</small>
            </span>
            <input id="favorites-show-icon" type="checkbox" />
          </label>
          <label class="setting-row">
            <span>
              <strong>Remember Quick Access section collapsed state</strong>
              <small>Keeps the unified Quick Access section collapsed or expanded between sessions.</small>
            </span>
            <input id="favorites-remember-collapsed" type="checkbox" />
          </label>
          <label class="setting-row">
            <span>
              <strong>Item name display</strong>
              <small>Compact fades one-line overflow and reveals it on hover; Full shows up to two lines.</small>
            </span>
            <select id="favorites-item-name-display">
              <option value="compact">Compact</option>
              <option value="full">Full</option>
            </select>
          </label>
        </fieldset>

        <fieldset>
          <legend>Folders</legend>
          <label class="setting-row">
            <span>
              <strong>Enable Folders</strong>
              <small>Organize Quick Access chats into folders and subfolders.</small>
            </span>
            <input id="folders-enabled" type="checkbox" />
          </label>
          <label class="setting-row">
            <span>
              <strong>Remember folder collapse state</strong>
              <small>Keeps individual folders collapsed between sessions.</small>
            </span>
            <input id="folders-remember-collapsed" type="checkbox" />
          </label>
          <label class="setting-row">
            <span>
              <strong>Show folder icons</strong>
              <small>Displays folder icons in the sidebar hierarchy.</small>
            </span>
            <input id="folders-show-icons" type="checkbox" />
          </label>
        </fieldset>
      </form>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <footer>v0.1-dev.8.2 · No telemetry · No account required</footer>
    </main>
    <script src="options.js"></script>
  </body>
</html>
